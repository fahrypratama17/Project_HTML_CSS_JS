<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>BrandApart Sticky Cards | Codegrid</title>
</head>
<body>

  <section class="intro">
    <h1>Enter the Frame</h1>
  </section>

  <section class="sticky-cards">
    <div class="card" id="card-1">
      <div class="col">
        <p>Quite Control</p>
        <h1>Signal Drift</h1>
      </div>
      <div class="col">
        <img src="images/Photo-1.jpg" alt="photo 1">
      </div>
    </div>
    <div class="card" id="card-2">
      <div class="col">
        <p>Wired Thought</p>
        <h1>Neural Assembly</h1>
      </div>
      <div class="col">
        <img src="images/Photo-2.jpg" alt="photo 2">
      </div>
    </div>
    <div class="card" id="card-3">
      <div class="col">
        <p>Silent Repetition</p>
        <h1>Learning Loop</h1>
      </div>
      <div class="col">
        <img src="images/Photo-3.jpg" alt="photo 3">
      </div>
    </div>
  </section>

  <section class="outro">
    <h1>Loop Complete</h1>
  </section>

</body>
</html>
