<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="https://kit.fontawesome.com/68ad341cbd.js" crossorigin="anonymous"></script>
  <title>Password Generator</title>
</head>
<body>
  
  <div class="container">
    <h1>Password Generator</h1>

    <!-- Password Container -->
    <div class="password-container">
      <input type="text" readonly id="password">
      <i class="far fa-copy" id="copy-btn" title="Copy to clipboard"></i>
    </div>

    <!-- Options -->
    <div class="options">
      <!-- Password length -->
      <div class="option">
        <label for="Length">Password Length</label>
        <div class="range-container">
          <input type="range" id="length" min="6" max="24" value="12">
          <span id="length-value">12</span>
        </div>
      </div>
      
      <!-- Include uppercase -->
      <div class="option">
        <label for="uppercase">Include Uppercase</label>
        <input type="checkbox" id="uppercase" checked>
      </div>

      <!-- Include lowercase -->
      <div class="option">
        <label for="lowercase">Include Lowercase</label>
        <input type="checkbox" id="lowercase" checked>
      </div>

      <!-- Include nukbers -->
      <div class="option">
        <label for="numbers">Include Numbers</label>
        <input type="checkbox" id="numbers" checked>
      </div>

      <!-- Include symbols -->
      <div class="option">
        <label for="symbols">Include Symbols</label>
        <input type="checkbox" id="symbols" checked>
      </div>
    </div>

    <button id="generate-btn">
      <i class="fas fa-key"></i>
      Generate Password
    </button>

    <div class="strength-container">
        <p>Password Strength: <span id="Strengh-label">Medium</span></p>

        <div class="strength-meter">
            <div class="strength-bar"></div>
        </div>
    </div>
  </div>

</body>
</html>
