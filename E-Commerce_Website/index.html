<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="script.js" defer></script>
  <title>E-Commerce Website</title>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">BuyMore</div>
        <div class="stats-card">
          <div class="stats-number">37</div>
          <div class="stats-label">Orders Last 7 days</div>
        </div>
      </div>

      <div class="sidebar-content">
        <button class="explore-button">
          <i class="fas fa-compass"></i> Explore New
        </button>

        <div class="nav-group">
          <a href="#" class="nav-tem active">
            <i class="fas fa-fire"></i> Popular Products
          </a>
          <a href="#" class="nav-tem">
            <i class="fas fa-tshirt"></i> Clothing & Shoes
          </a>
          <a href="#" class="nav-tem">
            <i class="fas fa-gift"></i> Gifts & Living
          </a>
          <a href="#" class="nav-tem">
            <i class="fas fa-lightbulb"></i> Inspiration
          </a>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="recent-orders">
          <h4>Recent Order</h4>
          <div class="order-item">
            <div class="order-dot"></div>
            <span>Nike Sneakers</span>
          </div>

          <div class="order-item">
            <div class="order-dot"></div>
            <span>Winter Jacket</span>
          </div>
        </div>

        <a href="#" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </aside>
    <!-- End of Sidebar -->
  </div>

</body>
</html>
